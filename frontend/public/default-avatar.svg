<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="3"/>

  <!-- Outer Pulse Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6" opacity="0.7"/>

  <!-- Core Glowing AI Sphere -->
  <circle cx="100" cy="100" r="50" fill="#0f172a" stroke="url(#circleGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Holographic AI Core Waveform / Eyes -->
  <path d="M 75 95 Q 100 80 125 95 Q 100 110 75 95 Z" fill="#38bdf8" opacity="0.9"/>
  <circle cx="90" cy="95" r="4" fill="#ffffff"/>
  <circle cx="110" cy="95" r="4" fill="#ffffff"/>

  <!-- Soundwave nodes -->
  <rect x="65" y="94" width="4" height="12" rx="2" fill="#60a5fa"/>
  <rect x="75" y="90" width="4" height="20" rx="2" fill="#38bdf8"/>
  <rect x="85" y="86" width="4" height="28" rx="2" fill="#93c5fd"/>
  <rect x="95" y="82" width="4" height="36" rx="2" fill="#ffffff"/>
  <rect x="105" y="86" width="4" height="28" rx="2" fill="#93c5fd"/>
  <rect x="115" y="90" width="4" height="20" rx="2" fill="#38bdf8"/>
  <rect x="125" y="94" width="4" height="12" rx="2" fill="#60a5fa"/>

  <!-- Base Arc -->
  <path d="M 60 145 C 80 135 120 135 140 145" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
